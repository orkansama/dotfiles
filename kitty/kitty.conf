font_family      JetBrainsMono Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto

map ctrl+plus change_font_size all +3.0
map ctrl+minus change_font_size all -3.0

map shift+alt+3 send_text all \x1b§

remember_window_size no

# BEGIN_KITTY_THEME
# Catppuccin-Mocha
include current-theme.conf
# END_KITTY_THEME
